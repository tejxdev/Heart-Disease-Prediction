<!DOCTYPE html>
<html>
<head>
    <title>Heart Disease Prediction</title>
    <style>
        body {
            background: linear-gradient(to right, #6a11cb, #2575fc);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
    
        .container {
            background-color: #ffffff;
            padding: 30px 40px;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
            max-width: 650px;
            width: 100%;
        }
    
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    
        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
    
        input[type="text"], input[type="number"] {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            width: 100%;
            transition: 0.3s;
        }
    
        input[type="text"]:focus {
            border-color: #2575fc;
            outline: none;
        }
    
        label {
            font-weight: 500;
            font-size: 14px;
        }
    
        .full-width {
            grid-column: 1 / span 2;
            text-align: center;
        }
    
        button {
            padding: 12px 25px;
            border: none;
            background-color: #007bff;
            color: white;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
    
        button:hover {
            background-color: #0056b3;
        }
    </style>
    
</head>
<body>
<div class="container">
    <h1>Heart Disease Prediction</h1>
    <form action="/predict" method="post">
        <input type="text" name="age" placeholder="Age">
        <input type="text" name="sex" placeholder="Sex (1=Male, 0=Female)">
        <input type="text" name="cp" placeholder="Chest Pain Type (0-3)">
        <input type="text" name="trestbps" placeholder="Resting Blood Pressure">
        <input type="text" name="chol" placeholder="Cholesterol">
        <input type="text" name="fbs" placeholder="Fasting Blood Sugar (>120) 1/0">
        <input type="text" name="restecg" placeholder="Rest ECG (0-2)">
        <input type="text" name="thalach" placeholder="Max Heart Rate">
        <input type="text" name="exang" placeholder="Exercise Induced Angina (1/0)">
        <input type="text" name="oldpeak" placeholder="ST Depression">
        <input type="text" name="slope" placeholder="Slope (0-2)">
        <input type="text" name="ca" placeholder="No. of Vessels Colored (0-3)">
        <input type="text" name="thal" placeholder="Thal (1=Normal, 2=Fixed, 3=Reversible)">
        <div class="full-width">
            <button type="submit">Predict</button>
        </div>
    </form>
</div>
</body>
</html>
